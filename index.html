<style>
#inw-gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:var(--bg)}
#inw-gate[hidden]{display:none}
.inw-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);display:grid;gap:14px;text-align:center}
.inw-mark{width:56px;height:56px;margin:0 auto;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 22px var(--f-display)}
.inw-card h1{margin:0;font:700 26px/1.15 var(--f-display);color:var(--ink)}
.inw-card .tag{justify-self:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:4px 10px}
.inw-card p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.45}
.inw-card .small{font-size:13px;color:var(--ink-3)}
#inw-login{justify-self:center;min-height:48px;padding:0 20px;display:inline-flex;align-items:center;gap:10px;font-size:16px}
#inw-login svg{width:20px;height:20px}
.inw-name-f{text-align:left}
#inw-go{justify-self:center;min-height:48px;padding:0 28px;font-size:16px}
#inw-gate-msg{min-height:1.3em;font-size:14px;color:var(--ink-2)}
#inw-gate-msg.err{color:var(--late)}
body.gated{overflow:hidden}
.acct-btn{font:600 13px var(--f-body);letter-spacing:.02em}
img.no-blob{visibility:hidden}
</style>
<style>
.inw-card .inw-mark{background:var(--accent) url('./icons/icon-192.png') center/cover;color:transparent}
.inw-card h1{font-size:24px}
.inw-f{display:grid;gap:12px;text-align:left}
.inw-f .btn{min-height:48px;font-size:16px}
.inw-card .field label{font-size:14px;font-weight:600}
.inw-card input{font-size:16px}
.pw{position:relative}.pw input{width:100%;padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-2);font:500 13px var(--f-body);padding:8px;cursor:pointer}
.inw-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px}
.lnk{border:0;background:none;color:var(--lent);font:500 15px var(--f-body);padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.inw-col{display:grid;gap:8px}
.inw-col .btn{min-height:48px}
.inw-msg{min-height:1.2em;font-size:14px;margin:0}
.inw-msg.err,.inw-card .err{color:var(--late)}
.inw-ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;text-align:left}
.inw-big{font-weight:700;color:var(--ink)!important;font-size:18px!important}
.inw-strip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.inw-pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--f-body);text-decoration:none;cursor:pointer}
.inw-pill svg{width:18px;height:18px}
.inw-pill.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.d-photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.u-row{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:6px}
.u-row.pend{grid-template-columns:1fr auto auto auto;background:var(--warn-bg);border-color:var(--warn)}
.u-row .u-main{min-width:0}.u-row .row-sub{overflow-wrap:anywhere}

@media (max-width:560px){.u-row,.u-row.pend{grid-template-columns:1fr auto}.u-row .u-main{grid-column:1/-1}.u-row.pend select{grid-column:1/-1;max-width:none}}
.u-add textarea{width:100%;font:15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.u-list{margin-top:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}.chk input{width:22px;height:22px}
/* instalacja na telefonie */
.inw-install{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 12px;padding:10px 12px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.inw-install>[data-act="inw-install"]{grid-column:2;grid-row:2;justify-self:start;width:auto}
.inw-install>.icon-btn{grid-column:3;grid-row:1}
@media (min-width:600px){.inw-install{grid-template-columns:auto 1fr auto auto}.inw-install>[data-act="inw-install"]{grid-column:3;grid-row:1}.inw-install>.icon-btn{grid-column:4}}
.inw-install .ii-ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent, #1b1f23);display:grid;place-items:center}
.inw-install .ii-ic svg{width:20px;height:20px}
.inw-install .ii-t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.inw-install .ii-t b{display:block;font-size:15px}
.ins-steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.ins-qr{display:grid;justify-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.ins-qr svg{width:180px;height:180px}
.ins-qr .linkbox{color:#1b1f23;font-size:14px;word-break:break-all;text-align:center}
/* kategorie */
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
a.chip-btn{display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.chip-btn .n{font-weight:500;opacity:.65;margin-left:0}
.chip-btn[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ca-list{display:grid;border-top:1px solid var(--line)}
.ca-row{display:grid;grid-template-columns:1fr minmax(150px,210px);gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ca-name{min-width:0;display:grid}.ca-name .hint{margin:0}
.ca-row select{font:15px var(--f-body);padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
@media (max-width:480px){.ca-row{grid-template-columns:1fr}}
.d-ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
/* widok drużynowego: pomieszczenia jako zwijane sekcje */
.d-rooms{flex-wrap:nowrap;overflow-x:auto;margin:10px -4px 0;padding:2px 4px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.d-rooms::-webkit-scrollbar{display:none}
.d-rooms button{flex:none;white-space:nowrap;scroll-snap-align:start}
.d-n{font-weight:500;opacity:.65;margin-left:2px;font-variant-numeric:tabular-nums}
.d-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin:6px 0 8px}
.d-bar .meta{margin:0}
.d-grp{margin:0 0 8px}
.d-grp>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.d-grp>summary::-webkit-details-marker{display:none}
.d-grp>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.d-grp>summary:hover{background:var(--surface-2)}}
.d-grp[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--surface-2)}
.d-grp[open]>.list{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.d-grp-t{flex:1;min-width:0;display:grid;gap:2px}
.d-grp-name{min-width:0;font:700 16px/1.2 var(--f-display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-grp-n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.d-grp-ic{flex:none;width:9px;height:9px;margin:0 4px 3px 2px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
.d-grp[open] .d-grp-ic{transform:rotate(-135deg);margin-bottom:-3px}
.d-loc{font-size:13px;color:var(--ink-3);margin-left:4px}
.d-where{margin:0;font-size:15px;color:var(--ink-2)}
</style>

<style>
/* Layout: phone-first storeroom ledger: sticky search bar, ruled lists like a stock book, a fixed bottom bar where Scan is the one loud control. */
:root{
  --bg:#E9EDF0;
  --surface:#FFFFFF;
  --surface-2:#F4F6F8;
  --ink:#131C25;
  --ink-2:#465463;
  --ink-3:#6F7C8A;
  --line:#D2D9E0;
  --accent:#F3C11A;
  --accent-edge:#D9A900;
  --on-accent:#131C25;
  --focus:#2456A6;
  --ok:#1C7446; --ok-bg:#E0F1E7;
  --lent:#2456A6; --lent-bg:#E2EAF8;
  --late:#AE2A20; --late-bg:#F9E4E1;
  --warn:#8A5300; --warn-bg:#FBEFD3;
  --qr-bg:#FFFFFF; --qr-fg:#0B0F14;
  --scrim:rgba(10,16,22,.5);
  --shadow:0 1px 2px rgba(19,28,37,.06),0 6px 20px rgba(19,28,37,.08);
  --toast-bg:#131C25; --toast-fg:#F4F6F8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#17202A; --surface-2:#1D2833; --ink:#E6EBEF; --ink-2:#A7B4C0; --ink-3:#83919E; --line:#2A3743;
    --accent:#F3C11A; --accent-edge:#F3C11A; --on-accent:#131C25; --focus:#F3C11A;
    --ok:#62C893; --ok-bg:#132C1F; --lent:#8EB3F3; --lent-bg:#172745; --late:#F08A80; --late-bg:#3A1916;
    --warn:#F2B65A; --warn-bg:#33250F;
    --qr-bg:#FFFFFF; --qr-fg:#0B0F14; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --toast-bg:#E6EBEF; --toast-fg:#131C25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --surface-2:#1D2833; --ink:#E6EBEF; --ink-2:#A7B4C0; --ink-3:#83919E; --line:#2A3743;
  --accent:#F3C11A; --accent-edge:#F3C11A; --on-accent:#131C25; --focus:#F3C11A;
  --ok:#62C893; --ok-bg:#132C1F; --lent:#8EB3F3; --lent-bg:#172745; --late:#F08A80; --late-bg:#3A1916;
  --warn:#F2B65A; --warn-bg:#33250F;
  --qr-bg:#FFFFFF; --qr-fg:#0B0F14; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --toast-bg:#E6EBEF; --toast-fg:#131C25;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:1px solid var(--accent-edge)}
.brand-mark svg{width:18px;height:18px}
.brand-name{font:800 15px/1 var(--f-display);font-stretch:122%;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:370px){.brand-name{display:none}}
.ro{font:600 11px/1 var(--f-body);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 8px;flex:none}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:400 16px/1 var(--f-body);padding:0 12px 0 36px}
.search input::placeholder{color:var(--ink-3)}

/* main */
.main{padding-block:18px 28px;display:grid;gap:22px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--ink-2);margin-bottom:-10px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.crumbs .sep{color:var(--ink-3)}
.head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.head-text{min-width:0;display:grid;gap:6px}
.eyebrow{font:600 11px/1.25 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h1{font:800 28px/1.08 var(--f-display);font-stretch:110%;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h1.code-h{font-family:var(--f-mono);font-weight:600;font-stretch:normal;letter-spacing:.06em}
.lead{margin:0;color:var(--ink-2);max-width:62ch;overflow-wrap:anywhere}
.sec{display:grid;gap:10px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.sec-title{font:700 13px/1.2 var(--f-display);font-stretch:116%;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0}
.sec-title .n,.issues-top .n{color:var(--ink-3);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:14px;margin:0}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:62px;text-decoration:none;border-top:1px solid var(--line);background:var(--surface);min-width:0}
button.row{width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer;font:inherit;color:inherit}
.list>.row:first-child{border-top:0}
a.row:active,label.row:active,button.row:active{background:var(--surface-2)}
@media (hover:hover){a.row:hover,label.row:hover,button.row:hover{background:var(--surface-2)}}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{font:600 13px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2)}
.thumb.ph{display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line)}
.thumb.ph svg{width:20px;height:20px}
.chev{width:18px;height:18px;color:var(--ink-3)}
.room-row .row-title{font:700 18px/1.2 var(--f-display);font-stretch:106%}
.counts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink-2)}
.counts b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.t-lent,.t-lent b{color:var(--lent)}
.t-late,.t-late b{color:var(--late)}
.t-warn,.t-warn b{color:var(--warn)}
.chip{display:inline-block;flex:0 1 auto;min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 12px/1 var(--f-body);padding:5px 8px;border-radius:999px}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.lent{color:var(--lent);background:var(--lent-bg)}
.chip.late{color:var(--late);background:var(--late-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.warn-mark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--warn-bg);color:var(--warn);font:800 12px/1 var(--f-body);vertical-align:1px;margin-left:4px}
.code{font-family:var(--f-mono);font-weight:600;letter-spacing:.05em;white-space:nowrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:12px 14px;display:grid;gap:3px;border-left:1px solid var(--line);text-decoration:none;min-width:0}
.stat:first-child{border-left:0}
.stat b{font:800 26px/1 var(--f-display);font-stretch:110%;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;line-height:1.3;color:var(--ink-2)}
.stat.late b{color:var(--late)}
.stat.warn b{color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.1 var(--f-body);text-decoration:none;cursor:pointer;text-align:center}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent-edge);color:var(--on-accent)}
.btn-big{min-height:52px;width:100%;font-size:16px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-danger{color:var(--late)}
.btn-danger-solid{background:var(--late);border-color:var(--late);color:var(--surface)}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px}
.btn-sm svg{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.link-btn{background:none;border:0;padding:0;font:500 13px/1.2 var(--f-body);color:var(--ink-2);text-decoration:underline;cursor:pointer}

/* entity head */
.qr-thumb{flex:none;display:grid;justify-items:center;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--qr-bg);cursor:pointer}

.qr-b{fill:var(--qr-bg)}

/* status */
.status{display:grid;gap:8px;padding:14px;border-radius:var(--r)}

.status.lent{background:var(--lent-bg)}

.status.lent .status-top{color:var(--lent)}
.status.late .status-top{color:var(--late)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.who-big{font:700 22px/1.15 var(--f-display);overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--ink-2);margin:0;overflow-wrap:anywhere}
.status .btn-big{margin-top:4px}
.loan-lines{display:grid}
.loan-line{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-block:10px;border-top:1px solid var(--line)}
.loan-line:first-child{border-top:0;padding-top:2px}
.loan-main{min-width:0;display:grid;gap:2px}
.loan-who{font:700 16px/1.25 var(--f-display);overflow-wrap:anywhere}

/* issues */
.issues{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.issues-top{color:var(--warn)}
.issues-top svg{width:18px;height:18px}
.issue{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
.issues-top+.issue,.issues>.issue:first-child{border-top:0;padding-top:0}
.issues a.issue-text{text-decoration:none;color:var(--warn)}
.issue-text{font-weight:600;overflow-wrap:anywhere}
.issue .actions{margin-top:4px}

/* facts */
.facts{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.facts>div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.facts>div:first-child{border-top:0}
.facts dt{font-size:13px;color:var(--ink-3);padding-top:1px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts a{text-decoration:none;border-bottom:1px solid var(--line)}
.codes{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 18px;display:grid;gap:10px;justify-items:start}

.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;color:var(--ink-2)}
.steps li::before{content:counter(s);font:700 13px/26px var(--f-mono);width:26px;height:26px;border-radius:6px;text-align:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 13px/1 var(--f-body);cursor:pointer;color:var(--ink-2)}

.tri{display:flex;flex-wrap:wrap;gap:6px;position:relative}

.tri label{min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;font:600 13px/1 var(--f-body);cursor:pointer;color:var(--ink-2);background:var(--surface)}

.tri input[value="missing"]:checked+label,.tri input[value="broken"]:checked+label,.tri input[value="lost"]:checked+label{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.tri input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px/1 var(--f-body);color:var(--ink-3);text-decoration:none;background:none;border:0;cursor:pointer;padding:0;min-width:0}

.scan-key{width:56px;height:56px;margin-top:-24px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid var(--accent-edge)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}

/* scan */

/* big qr */

/* labels */

/* toast, loading */
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:max-content;max-width:min(92vw,480px);background:var(--toast-bg);color:var(--toast-fg);padding:11px 16px;border-radius:10px;font:500 14px/1.35 var(--f-body);box-shadow:var(--shadow);border:1px solid transparent}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = v => String(v || "").toLowerCase().replace(/ł/g, "l").normalize("NFD").replace(/[̀-ͯ]/g, "");
const fmtCode = c => c ? `${c.slice(0,3)} ${c.slice(3)}` : "";
const now = () => new Date().toISOString();
const todayYMD = () => new Date().toLocaleDateString("sv-SE");
const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, parseInt(v, 10) || 0));
function ymdPlus(days){ const d = new Date(); d.setDate(d.getDate() + days); return d.toLocaleDateString("sv-SE"); }
function pl(n, a, b, c){ const n10 = n % 10, n100 = n % 100; if (n === 1) return a; if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return b; return c; }
const DF = new Intl.DateTimeFormat("pl-PL", {day:"numeric", month:"short"});
const DFY = new Intl.DateTimeFormat("pl-PL", {day:"numeric", month:"short", year:"numeric"});
function fmtDate(v){ if (!v) return ""; const d = v instanceof Date ? v : new Date(v); if (isNaN(d)) return ""; return (d.getFullYear() === new Date().getFullYear() ? DF : DFY).format(d); }
function fmtYMD(ymd){ if (!ymd) return ""; const [y, m, d] = String(ymd).split("-").map(Number); return fmtDate(new Date(y, (m || 1) - 1, d || 1)); }
function dur(iso){ const a = new Date(iso), t = new Date(); const n = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000); return n <= 0 ? "od dziś" : n === 1 ? "1 dzień" : `${n} dni`; }
const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "pl", {sensitivity:"base", numeric:true});
const ready = () => S.got.rooms && S.got.boxes && S.got.items && S.got.active;
const arr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];

/* ---------- meeting 16.11: helpers ---------- */
const PERSONAL = "Wypożyczenie osobiste";
const DEFAULT_CATS = ["Sprzęt biwakowy", "Kuchnia obozowa", "Sprzęt pionierski", "Sprzęt elektroniczny", "Materiały programowe", "Meble i wyposażenie", "Inne"];
const NOCAT = "~bez";
function catsList(){ const d = S.config.get("categories"); const l = d && Array.isArray(d.list) ? d.list.filter(x => typeof x === "string" && x.trim()) : null; return l && l.length ? l : DEFAULT_CATS; }
function catOpts(cur){ const l = catsList(), all = cur && !l.includes(cur) ? [...l, cur] : l; return `<option value="">— bez kategorii —</option>` + all.map(c => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join(""); }
function catHref(c){ return "#kategoria/" + encodeURIComponent(c || NOCAT); }
function catCounts(){ const m = new Map(); for (const i of S.items.values()){ const k = i.cat || ""; m.set(k, (m.get(k) || 0) + 1); } return m; }
function catChipsHTML(cur){
  const cnt = catCounts(), l = catsList(), extra = [...cnt.keys()].filter(c => c && !l.includes(c)).sort((a, b) => a.localeCompare(b, "pl"));
  const chip = (key, label, n) => `<a class="chip-btn" href="${catHref(key)}"${cur === (key || NOCAT) ? ' aria-current="page"' : ""}>${esc(label)} <span class="n">${n}</span></a>`;
  return `<div class="cat-chips">${[...l.filter(c => cnt.get(c)), ...extra].map(c => chip(c, c, cnt.get(c))).join("")}${cnt.get("") ? chip("", "Bez kategorii", cnt.get("")) : ""}</div>`;
}
function catsHomeHTML(){
  if (!S.items.size) return "";
  const none = (catCounts().get("") || 0) === S.items.size;
  return `<section class="sec"><div class="sec-head"><h2 class="sec-title">Kategorie</h2>${canFull() ? `<button type="button" class="btn btn-sm btn-ghost" data-act="cats-edit">${IC.list}<span>Edytuj listę</span></button>` : ""}</div>${catChipsHTML("")}${none ? `<p class="hint">Żadna rzecz nie ma jeszcze kategorii. Otwórz „Bez kategorii” i przypisz je hurtem.</p>` : ""}</section>`;
}
function viewCategory(cat){
  if (!ready()) return loadingView();
  const none = !cat || cat === NOCAT, name = none ? "Bez kategorii" : cat;
  const items = [...S.items.values()].filter(i => none ? !i.cat : i.cat === cat).sort(byName);
  const groups = roomsArr().map(r => [r.name, items.filter(i => i.roomId === r.id)]).filter(([, l]) => l.length);
  const orphan = items.filter(i => !S.rooms.has(i.roomId)); if (orphan.length) groups.push(["Bez pomieszczenia", orphan]);
  const av = items.filter(i => avail(i) > 0).length;
  return `${crumbs([])}<div class="head"><div class="head-text"><div class="eyebrow">Kategoria</div><h1>${esc(name)}</h1><p class="lead">${items.length} ${pl(items.length, "przedmiot", "przedmioty", "przedmiotów")}${items.length ? ` · dostępne teraz: ${av}` : ""}</p></div>${S.canWrite && items.length ? `<button type="button" class="btn" data-act="cat-assign" data-f="${esc(none ? NOCAT : cat)}">${IC.list}<span>${none ? "Przypisz kategorie" : "Zmień kategorie"}</span></button>` : ""}</div>
  ${catChipsHTML(none ? NOCAT : cat)}
  ${items.length ? groups.map(([t, l]) => sec(esc(t), l.map(i => itemRow(i, false)))).join("") : `<div class="empty"><h2>Pusto</h2><p>W tej kategorii nie ma jeszcze żadnej rzeczy.</p></div>`}`;
}
function catAssignSheet(cat){
  const none = !cat || cat === NOCAT;
  const items = [...S.items.values()].filter(i => none ? !i.cat : i.cat === cat).sort((a, b) => locText(a).localeCompare(locText(b), "pl", {numeric:true}) || byName(a, b));
  if (!items.length) return;
  openSheet(none ? "Przypisz kategorie" : `Zmień kategorie: ${cat}`, `<form class="f" novalidate>
    <p class="hint">Wybierz kategorię przy każdej rzeczy. Zapiszą się tylko zmienione.</p>
    <div class="field"><label for="ca-all">Ustaw wszystkim na liście</label><select id="ca-all"><option value="~">— nie zmieniaj —</option>${catOpts("").replace('<option value="">— bez kategorii —</option>', "")}</select></div>
    <div class="ca-list">${items.map(i => `<div class="ca-row"><div class="ca-name"><span><b>${esc(i.name)}</b>${qtyOf(i) !== 1 ? ` <span class="qty">×${qtyOf(i)}</span>` : ""}</span><span class="hint">${esc(locText(i) || "bez pomieszczenia")}</span></div><select data-ca="${i.id}" aria-label="Kategoria: ${esc(i.name)}">${catOpts(i.cat || "")}</select></div>`).join("")}</div>
    <div class="form-actions"><button type="button" class="btn" data-act="close-sheet">Anuluj</button><button type="submit" class="btn btn-primary">Zapisz</button></div></form>`, w => {
    $("#ca-all", w).addEventListener("change", e => { const v = e.target.value; if (v === "~") return; $$("[data-ca]", w).forEach(s => { s.value = v; }); });
    onSubmit(w, async () => {
      const ch = $$("[data-ca]", w).map(s => [s.dataset.ca, s.value]).filter(([id, v]) => { const i = S.items.get(id); return i && (i.cat || "") !== v; });
      if (!ch.length){ toast("Nic się nie zmieniło."); return true; }
      const t = now();
      for (const [id, v] of ch) await retry(() => S.db.doc("items/" + id).update({cat:v, updatedAt:t, updatedBy:S.me.id}));
      logEv("item", `Przypisano kategorie: ${ch.length} ${pl(ch.length, "przedmiot", "przedmioty", "przedmiotów")}`, {d:ch.slice(0, 40).map(([id, v]) => `${(S.items.get(id) || {}).name || id} → ${v || "bez kategorii"}`).join("; ")});
      toast(`Zapisano kategorie: ${ch.length}.`); return true;
    });
  }, {noFocus:true});
}
function catsForm(){
  openSheet("Lista kategorii", `<form class="f" novalidate><div class="field"><label for="f-cats">Jedna kategoria w linii</label><textarea id="f-cats" style="min-height:260px">${esc(catsList().join("\n"))}</textarea><p class="hint">Kolejność z tej listy jest kolejnością w aplikacji, także u drużynowych. Zmiana nazwy tutaj nie zmienia jej w rzeczach, które już ją mają: popraw je przyciskiem „Zmień kategorie” w widoku kategorii.</p></div><div class="form-actions"><button type="button" class="btn" data-act="close-sheet">Anuluj</button><button type="submit" class="btn btn-primary">Zapisz</button></div></form>`, w => {
    onSubmit(w, async () => {
      const list = [...new Set($("#f-cats", w).value.split("\n").map(x => x.trim().slice(0, 60)).filter(x => x && x !== NOCAT))].slice(0, 60);
      if (!list.length){ fieldErr(w, "#f-cats", "Wpisz co najmniej jedną kategorię."); return false; }
      const old = catsList();
      await retry(() => S.db.doc("config/categories").set({list, updatedAt:now(), updatedBy:S.me.id}));
      const add = list.filter(u => !old.includes(u)), rem = old.filter(u => !list.includes(u));
      logEv("units", "Zmieniono listę kategorii", {d:[add.length ? `dodano: ${add.join(", ")}` : "", rem.length ? `usunięto: ${rem.join(", ")}` : ""].filter(Boolean).join(" · ") || "zmieniona kolejność"});
      toast("Zapisano listę kategorii."); return true;
    });

const qrCache = new Map();
function qrMatrix(text){

}

function viewSearch(q){
  if (!ready()) return loadingView();
  const n = norm(q), cq = q.toUpperCase().replace(/[\s\-]/g, "");
  const codeHit = e => cq.length >= 3 && /^[A-Z0-9]+$/.test(cq) && [e.id, ...arr(e.codes)].some(c => c.includes(cq));
  const hit = (...f) => f.some(x => norm(x).includes(n));
  const items = [...S.items.values()].filter(i => codeHit(i) || hit(i.name, i.note, i.cat, partsTxt(i.parts), loansOf(i.id).map(l => `${l.to} ${l.unit || ""}`).join(" "))).sort(byName);
  const boxes = [...S.boxes.values()].filter(b => codeHit(b) || hit(b.name, b.note, b.place)).sort(byName);
  const rooms = [...S.rooms.values()].filter(r => codeHit(r) || hit(r.name, r.note)).sort(byName);
  const total = items.length + boxes.length + rooms.length;
  return `<div class="head"><div class="head-text"><div class="eyebrow">Wyniki wyszukiwania</div><h1>„${esc(q)}”</h1></div></div>

}

/* ---------- label drawing ---------- */
function wrapText(ctx, text, maxW, maxLines){
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = []; let cur = "";
  const fits = s => ctx.measureText(s).width <= maxW;
  for (let w of words){
    const t = cur ? cur + " " + w : w;
    if (fits(t)){ cur = t; continue; }
    if (cur){ lines.push(cur); cur = ""; }
    while (w.length > 1 && !fits(w)){ let j = w.length - 1; while (j > 1 && !fits(w.slice(0, j))) j--; lines.push(w.slice(0, j)); w = w.slice(j); }
    cur = w;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    const keep = lines.slice(0, maxLines); let last = keep[maxLines - 1];
    while (last.length > 1 && !fits(last + "…")) last = last.slice(0, -1);
    keep[maxLines - 1] = last.trimEnd() + "…"; return keep;
  }
  return lines;
}
function drawLabel(ctx, e, x, y, f, k, cut){
  const P = v => v * k;
  if (cut){ ctx.save(); ctx.strokeStyle = "#9aa4ae"; ctx.lineWidth = Math.max(1, 0.2 * k); ctx.setLineDash([P(1.5), P(1.2)]); ctx.strokeRect(P(x), P(y), P(f.w), P(f.h)); ctx.restore(); }
  const small = f.h < 30, large = f.h > 50;
  const pad = small ? 2.2 : large ? 5 : 3;
  const qs = Math.min(f.h - 2 * pad, f.w * 0.46);
  drawQR(ctx, qrText(e.code), P(x + pad), P(y + (f.h - qs) / 2), P(qs));
  const tx = x + pad + qs + (small ? 1.8 : pad * 0.9), tw = x + f.w - pad - tx;
  const nameSz = small ? 2.8 : large ? 6.4 : 4.1, subSz = small ? 2.2 : large ? 3.8 : 2.7, codeSz = small ? 2.5 : large ? 4.4 : 3.1, eyeSz = large ? 2.8 : 2.1;
  const bottom = y + f.h - pad;
  let ty = y + pad + (small ? 0.1 : 0.3);
  ctx.textBaseline = "top";
  ctx.fillStyle = "#0b0f14"; ctx.font = `600 ${P(codeSz)}px "IBM Plex Mono", ui-monospace, monospace`;
  ctx.fillText(fmtCode(e.code), P(tx), P(bottom - codeSz));
  const textBottom = bottom - codeSz - (small ? 0.8 : 1.4);
  if (e.blank){
    ctx.fillStyle = "#4a5562"; ctx.font = `500 ${P(subSz)}px "IBM Plex Sans", system-ui, sans-serif`;
    for (const l of wrapText(ctx, "Zeskanuj, aby opisać", P(tw), small ? 2 : 3)){ ctx.fillText(l, P(tx), P(ty)); ty += subSz * 1.25; }
    return;
  }
  if (!small){ ctx.fillStyle = "#5f6b78"; ctx.font = `600 ${P(eyeSz)}px "IBM Plex Sans", system-ui, sans-serif`; ctx.fillText(KIND[e.kind].toUpperCase(), P(tx), P(ty)); ty += eyeSz * 1.5; }
  const lh = nameSz * 1.12, sLh = subSz * 1.25;
  ctx.fillStyle = "#0b0f14"; ctx.font = `700 ${P(nameSz)}px "Archivo", "Arial Narrow", system-ui, sans-serif`;
  const nameRoom = Math.max(1, Math.floor((textBottom - ty - (e.sub ? sLh : 0)) / lh));
  for (const l of wrapText(ctx, e.name, P(tw), Math.min(small ? 2 : 3, nameRoom))){ ctx.fillText(l, P(tx), P(ty)); ty += lh; }
  if (e.sub){
    const room = Math.min(2, Math.floor((textBottom - ty - 0.3) / sLh));
    if (room >= 1){ ctx.fillStyle = "#4a5562"; ctx.font = `500 ${P(subSz)}px "IBM Plex Sans", system-ui, sans-serif`; ty += 0.3; for (const l of wrapText(ctx, e.sub, P(tw), room)){ ctx.fillText(l, P(tx), P(ty)); ty += sLh; } }
  }
}
function renderSheet(c, ents, skip, f, cut, preview, k){
  const ctx = c.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
  const per = f.cols * f.rows;
  for (let s = 0; s < per; s++){
    const x = f.mx + (s % f.cols) * f.w, y = f.my + Math.floor(s / f.cols) * f.h;
    if (preview && !cut){ ctx.strokeStyle = "#dde2e7"; ctx.lineWidth = 1; ctx.strokeRect(x * k + 0.5, y * k + 0.5, f.w * k - 1, f.h * k - 1); }
    if (s < skip){ if (preview){ ctx.fillStyle = "#eceff2"; ctx.fillRect(x * k + 1, y * k + 1, f.w * k - 2, f.h * k - 2); } continue; }
    const e = ents[s - skip]; if (!e) continue;
    drawLabel(ctx, e, x, y, f, k, cut);
  }
}
let prevT = 0;
function schedulePreview(){ clearTimeout(prevT); prevT = setTimeout(drawPreview, 120); }
function drawPreview(){
  const c = $("#lab-prev"); if (!c || typeof window.qrcode !== "function") return;
  const f = FMT[S.lab.fmt], ents = labelEntries().slice(0, f.cols * f.rows - S.lab.skip);
  const paint = () => { const cc = $("#lab-prev"); if (cc) renderSheet(cc, ents, S.lab.skip, f, S.lab.cut, true, cc.width / 210); };
  paint(); fontsReady().then(paint);
}
async function makePdf(){
  const ents = labelEntries(); if (!ents.length || !S.downloads) return;
  const setBtn = busy => { const b = $("#lab-pdf"); if (!b) return; b.disabled = busy || !labStats().n; const sp = b.querySelector("span"); if (sp) sp.textContent = busy ? "Tworzę PDF…" : "Pobierz PDF"; };
  setBtn(true);
  try {
    await Promise.all([loadScript(JSPDF_URL), fontsReady()]);
    const f = FMT[S.lab.fmt], per = f.cols * f.rows, k = 250 / 25.4;
    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    const c = document.createElement("canvas"); c.width = Math.round(210 * k); c.height = Math.round(297 * k);
    let idx = 0, skip = S.lab.skip, page = 0;
    while (idx < ents.length){

      renderSheet(c, chunk, skip, f, S.lab.cut, false, k);
      if (page) pdf.addPage("a4", "portrait");
      pdf.addImage(c.toDataURL("image/jpeg", 0.94), "JPEG", 0, 0, 210, 297, undefined, "FAST");
      idx += take; skip = 0; page++;
      await new Promise(r => setTimeout(r, 0));
    }
    await S.downloads.save({filename:`etykiety-qr-${todayYMD()}.pdf`, data:pdf.output("blob")});
    toast(`Zapisano PDF: ${ents.length} ${pl(ents.length, "etykieta", "etykiety", "etykiet")}.`);
    if (S.lab.blank) S.blankCodes = [];
  } catch (e){

    if (c === "declined"){ /* viewer said no */ }
    else if (c === "rate_limited") toast("Poczekaj chwilę i spróbuj jeszcze raz.");
    else { console.error(e); toast("Nie udało się utworzyć PDF. Spróbuj ponownie.", "err"); }
  } finally { setBtn(false); schedulePreview(); }
}

/* ---------- scanning ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file); }
  catch (_){ return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
}
async function decodeImageFile(file){
  const src = await loadBitmap(file);
  const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height;
  if ("BarcodeDetector" in window){
    try { const det = new window.BarcodeDetector({formats:["qr_code"]}); const r = await det.detect(src); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } catch (_){}
  }
  await loadScript(JSQR_URL);
  const c = document.createElement("canvas"), ctx = c.getContext("2d", {willReadFrequently:true});
  const sizes = [...new Set([1000, 1600, 700, 2400].map(m => Math.min(1, m / Math.max(W, H))))];
  for (const s of sizes){
    c.width = Math.max(1, Math.round(W * s)); c.height = Math.max(1, Math.round(H * s));
    ctx.drawImage(src, 0, 0, c.width, c.height);
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const r = window.jsQR(img.data, img.width, img.height, {inversionAttempts:"attemptBoth"});
    if (r && r.data) return r.data;
  }
  return null;
}

async function assignCodeTo(t, code, say){
  const [k, e] = findCode(code);
  if (k){ say(e.id === t.id ? "Ta naklejka już należy do tej rzeczy." : `Ta naklejka należy już do: ${e.name}. Użyj innej.`, true); return; }
  const map = S[COL[t.kind]], ent = map.get(t.id);
  if (!ent){ say("Tej rzeczy nie ma już w spisie.", true); return; }
  try {
    const codes = [...arr(ent.codes), code], upd = {codes, updatedAt:now(), updatedBy:S.me.id};
    if (t.kind === "item") upd.label = true;
    await retry(() => S.db.doc(COL[t.kind] + "/" + t.id).update(upd));
    logEv("label", `Przypisano naklejkę ${fmtCode(code)}: ${ent.name}`, t.kind === "item" ? {item:t.id} : {place:t.id});
    map.set(t.id, {...ent, ...upd}); rebuildAlias();

function closeSheet(){
  const w = $("#sheet"); S.scanMode = null; if (w.hidden) return;
  w.hidden = true; w.innerHTML = ""; document.body.classList.remove("locked");
  if (S.pendingRender) render();
}
let toastT = 0;
function toast(msg, kind){
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (kind === "err" ? " err" : ""); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, kind === "err" ? 5200 : 2800);
}
const UPLOAD_CODES = new Set(["too_large", "unsupported_type", "quota_or_state", "not_uploader", "upstream_auth", "store_unavailable", "upstream_error", "invalid_request"]);
function handleErr(e){
  console.warn(e); const c = e && e.code;
  if (c === "invalid_argument"){
    if (!S.canKnown){ S.canWrite = false; updateRO(); render(); toast("Nie masz uprawnień do zmian w tym spisie. Poproś właściciela o dostęp do edycji.", "err"); }
    else toast("Nie udało się zapisać. Ktoś mógł to właśnie zmienić. Spróbuj ponownie.", "err");
    return;
  }
  if (c === "quota_exceeded"){ toast("Baza jest pełna. Usuń niepotrzebne wpisy i spróbuj ponownie.", "err"); return; }
  if (c === "resource_exhausted" || c === "rate_limited"){ toast("Za dużo zmian naraz. Odczekaj chwilę i spróbuj ponownie.", "err"); return; }
  if (UPLOAD_CODES.has(c)){ toast("Nie udało się wgrać zdjęcia. Spróbuj innego albo zapisz bez zdjęcia.", "err"); return; }
  toast("Nie udało się zapisać. Sprawdź połączenie i spróbuj ponownie.", "err");
}
function onSubmit(w, fn){
  const form = $("form", w);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btns = $$("button[type=submit]", form), sub = e.submitter || btns[0];
    const old = sub ? sub.textContent : "";
    btns.forEach(b => b.disabled = true); if (sub) sub.textContent = "Zapisywanie…";
    try { const ok = await fn(sub); if (ok !== false){ closeSheet(); return; } }
    catch (err){ handleErr(err); }
    btns.forEach(b => b.disabled = false); if (sub) sub.textContent = old;
  });
}
function fieldErr(w, sel, msg){ const el = $(sel, w); if (el){ el.setAttribute("aria-invalid", "true"); el.focus(); el.addEventListener("input", () => el.removeAttribute("aria-invalid"), {once:true}); } toast(msg, "err"); }
const radio = (name, value, label, checked) => `<input type="radio" name="${name}" id="r-${name}-${value}" value="${value}"${checked ? " checked" : ""}><label for="r-${name}-${value}">${label}</label>`;

function photoField(cur){
  return `<div class="field"><span class="flabel">Zdjęcie <span class="opt">(opcjonalnie)</span></span><div class="photo-field"><img id="f-prev" class="photo-prev" alt=""${cur ? ` src="${esc(INW_BLOB(cur))}" data-blob="${esc(cur)}"` : " hidden"}><div class="photo-btns"><label class="btn" for="f-photo">${IC.camera}<span>${cur ? "Zmień zdjęcie" : "Dodaj zdjęcie"}</span></label><button type="button" class="btn btn-ghost btn-danger" id="f-photo-rm"${cur ? "" : " hidden"}>Usuń zdjęcie</button></div><input id="f-photo" class="vh" type="file" accept="image/*"></div></div>`;
}
function mountPhoto(w, cur){
  const st = {cur:cur || null, file:null, removed:false};
  const inp = $("#f-photo", w), prev = $("#f-prev", w), rm = $("#f-photo-rm", w);
  if (!inp) return st;
  inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; if (!f) return; st.file = f; st.removed = false; prev.src = URL.createObjectURL(f); prev.hidden = false; rm.hidden = false; });
  rm.addEventListener("click", () => { st.file = null; st.removed = true; prev.hidden = true; prev.removeAttribute("src"); rm.hidden = true; inp.value = ""; });
  return st;
}
async function compressImage(file, max = 1000){
  const img = await loadBitmap(file);
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height, s = Math.min(1, max / Math.max(W, H));
  const c = document.createElement("canvas"); c.width = Math.round(W * s); c.height = Math.round(H * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.72));
}
async function resolvePhoto(st){
  if (!st) return undefined;
  if (st.file){ const blob = await compressImage(st.file); const r = await S.assets.upload(blob, {type:"image/jpeg"}); return r.id; }
  if (st.removed) return null;
  return st.cur;
}
function dropOldPhoto(st, newId){ if (st && st.cur && st.cur !== newId && S.assets) S.assets.delete(st.cur).catch(() => {}); }

async function resolveIssue(issueId, mode, btn){
  const x = S.issues.find(y => y.id === issueId); if (!x || !x.open) return;
  if (btn) btn.disabled = true;
  try {
    const t = now();
    if (mode === "writeoff"){ const i = S.items.get(x.itemId); if (i) await retry(() => S.db.doc("items/" + i.id).update({qty:Math.max(0, qtyOf(i) - (+x.missing || 0)), updatedAt:t, updatedBy:S.me.id})); }
    await retry(() => S.db.doc("issues/" + issueId).update({open:false, resolvedAt:t, resolvedBy:S.me.id, resolution:mode}));
    logEv("issue", mode === "writeoff" ? `Spisano braki: ${x.itemName || ""}` : `Usterka załatwiona: ${x.itemName || ""}`, {item:x.itemId, d:`${x.text || ""}${mode === "writeoff" && x.missing ? ` (stan −${x.missing} szt.)` : ""}`});
    toast(mode === "writeoff" ? "Spisano ze stanu." : "Oznaczono jako załatwione.");
  } catch (e){ if (btn) btn.disabled = false; handleErr(e); }
}

function loanExtend(ids){
  const ls = String(ids).split(",").map(findLoan).filter(l => l && l.open); if (!ls.length) return;
  const td = todayYMD(), last = ls.map(l => l.due).filter(Boolean).sort().pop() || "", start = last && last > td ? last : td;
  openSheet(ls.length > 1 ? `Przedłuż termin (${ls.length})` : "Przedłuż termin", `<form class="f" novalidate>
    <div><p class="sheet-lead">${esc(ls[0].to || "")}${unitTxt(ls[0]) ? ` · ${esc(unitTxt(ls[0]))}` : ""}</p><p class="meta">${esc(ls.map(l => `${loanName(l)}${lq(l) > 1 ? ` ×${lq(l)}` : ""}`).join(", "))}</p><p class="meta">Obecny termin: ${esc(last ? fmtYMD(last) : "bez terminu")}</p></div>
    <div class="field"><label for="ex-due">Nowy termin zwrotu</label><input id="ex-due" type="date" min="${td}" value="${ymdAdd(start, 7)}"><div class="chips-row"><button type="button" class="chip-btn" data-add="7">+7 dni</button><button type="button" class="chip-btn" data-add="14">+14 dni</button><button type="button" class="chip-btn" data-add="30">+30 dni</button></div></div>
    <div class="form-actions"><button type="button" class="btn" data-act="close-sheet">Anuluj</button><button type="submit" class="btn btn-primary">Przedłuż</button></div>
  </form>`, w => {
    $("form", w).addEventListener("click", e => { const b = e.target.closest("[data-add]"); if (b) $("#ex-due", w).value = ymdAdd(start, +b.dataset.add); });

function loanUndo(id){
  const L = findLoan(id); if (!L || L.open) return;
  const i = S.items.get(L.itemId);
  if (!i){ toast("Tego przedmiotu nie ma już w spisie, więc nie da się cofnąć zwrotu.", "err"); return; }
  const need = lq(L) - (L.lostQty ? +L.lostQty : 0);
  if (avail(i) < need){ toast(`Nie da się cofnąć: ${need} szt. jest już wydanych komuś innemu.`, "err"); return; }
  const moved = L.backRoomId && L.fromRoomId && (L.backRoomId !== L.fromRoomId || (L.backBoxId || null) !== (L.fromBoxId || null));
  const nIss = S.issues.filter(x => [L.id, L.splitFrom].filter(Boolean).includes(x.loanId) && x.at === L.back).length;
  openSheet("Cofnąć zwrot?", `<div class="f"><p class="lead">„${esc(loanName(L))}”${lq(L) > 1 ? ` ×${lq(L)}` : ""} wróci na listę wypożyczonych u ${esc(L.to || "")}.${nIss ? ` Usunę też ${nIss} ${pl(nIss, "usterkę zgłoszoną", "usterki zgłoszone", "usterek zgłoszonych")} przy tym zwrocie.` : ""}</p>${moved ? `<p class="hint t-warn">Przy zwrocie rzecz trafiła do: ${esc(placeTxt(L.backRoomId, L.backBoxId))}. Jeśli trzeba, przenieś ją z powrotem w edycji przedmiotu.</p>` : ""}<div class="form-actions"><button type="button" class="btn" data-act="close-sheet">Wróć</button><button type="button" class="btn btn-danger-solid" data-act="loan-undo-do" data-id="${L.id}">Cofnij zwrot</button></div></div>`, null, {noFocus:true});

async function loanUndoDo(id, btn){
  const L = findLoan(id); if (!L || L.open){ closeSheet(); return; }
  if (btn) btn.disabled = true;
  try {
    const ids = [L.id, L.splitFrom].filter(Boolean);
    for (const x of S.issues.filter(y => ids.includes(y.loanId) && y.at === L.back)) await retry(() => S.db.doc("issues/" + x.id).delete());
    const orig = L.splitFrom ? S.active.find(l => l.id === L.splitFrom) : null;
    if (orig){ await retry(() => S.db.doc("loans/" + orig.id).update({qty:lq(orig) + lq(L)})); await retry(() => S.db.doc("loans/" + L.id).delete()); }
    else await retry(() => S.db.doc("loans/" + L.id).update({open:true, back:null, backBy:null, backNote:"", returnedBy:null, backRoomId:null, backBoxId:null, backPhoto:null, partsBack:null, itemState:null, backQty:null, lostQty:null, undoneAt:now(), undoneBy:S.me.id}));
    logEv("undo", `Cofnięto zwrot: ${loanName(L)}${lq(L) > 1 ? ` ×${lq(L)}` : ""}`, {item:L.itemId, loan:orig ? orig.id : L.id, unit:unitTxt(L), d:[`zwrot z ${fmtDT(L.back)}`, `znów wypożyczone: ${[L.to, unitTxt(L)].filter(Boolean).join(", ")}`, L.backNote ? `uwagi tamtego zwrotu: ${L.backNote}` : ""].filter(Boolean).join(" · ")});
    closeSheet(); toast("Cofnięto zwrot. Rzecz znów jest wypożyczona.");
  } catch (e){ if (btn) btn.disabled = false; handleErr(e); }
}

/* ----- history ----- */
function dayLabel(iso){ const d = new Date(iso), t = new Date(); const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()), tt = new Date(t.getFullYear(), t.getMonth(), t.getDate()); const diff = Math.round((tt - dd) / 86400000); if (diff === 0) return "Dziś"; if (diff === 1) return "Wczoraj"; return cap(new Intl.DateTimeFormat("pl-PL", {weekday:"long", day:"numeric", month:"long", year:d.getFullYear() === t.getFullYear() ? undefined : "numeric"}).format(d)); }
/* ----- archive ----- */
function ARCH_LBL(r){ return {broken:"zniszczone", lost:"zgubione", given:"przekazane lub sprzedane", other:"spisane"}[r] || "spisane"; }

    <fieldset class="field fs"><legend class="flabel">Powód</legend><div class="tri">${radio("arr", "broken", "zniszczone", true)}${radio("arr", "lost", "zgubione")}${radio("arr", "given", "przekazane lub sprzedane")}${radio("arr", "other", "inne")}</div></fieldset>
    <div class="field"><label for="f-anote">Notatka <span class="opt">(opcjonalnie)</span></label><input id="f-anote" maxlength="300" placeholder="np. rozdarty tropik, nie do naprawy"></div>
    <div class="form-actions"><button type="button" class="btn" data-act="close-sheet">Anuluj</button><button type="submit" class="btn btn-danger-solid">Spisz ze stanu</button></div></form>`, w => {
    onSubmit(w, async () => {
      const t = now(), reason = (w.querySelector('input[name="arr"]:checked') || {}).value || "other", note = $("#f-anote", w).value.trim();
      for (const x of issuesOf(id)) await retry(() => S.db.doc("issues/" + x.id).update({open:false, resolvedAt:t, resolvedBy:S.me.id, resolution:"archived"}));
      await retry(() => S.db.doc("items/" + id).update({archived:true, archivedAt:t, archivedBy:S.me.id, archiveReason:reason, archiveNote:note, updatedAt:t, updatedBy:S.me.id}));

function scanResult(code){
  const aim = S.canWrite ? S.scanAim : "open";
  if (aim === "open"){ closeSheet(); go(code); return; }
  const [k, e] = findCode(code);
  if (k !== "item"){ scanSay(k ? `To ${k === "box" ? "pudło" : "pomieszczenie"} „${e.name}”. Zeskanuj naklejkę przedmiotu.` : `Kodu ${fmtCode(code)} nie ma w spisie.`, true); return; }
  if (aim === "cart"){
    const c = S.cart.find(x => x.itemId === e.id), av = avail(e);
    if (c){
      if (qtyOf(e) > 1 && c.qty < av) c.qty++;
      else { scanSay(`${e.name} już jest w koszyku${qtyOf(e) > 1 ? ` (${c.qty} szt., wolnych ${av})` : ""}.`, true); return; }
    } else {
      if (av <= 0){ scanSay(`${e.name}: nie ma teraz wolnych sztuk.`, true); return; }
      S.cart.push({itemId:e.id, qty:1});
    }
    saveCart(); const cc = S.cart.find(x => x.itemId === e.id);
    scanSay(`✓ ${e.name}${cc.qty > 1 ? ` ×${cc.qty}` : ""}. Zeskanuj następną rzecz.`); updateScanUI(); return;
  }
  const all = loansOf(e.id);
  if (!all.length){ scanSay(`${e.name} nie jest teraz wypożyczone.`, true); return; }
  const ls = all.filter(l => !S.retBasket.includes(l.id));
  if (!ls.length){ scanSay(`${e.name} już jest na liście zwrotu.`, true); return; }
  if (ls.length > 1){
    const people = new Set(S.retBasket.map(id => (S.active.find(l => l.id === id) || {}).to).filter(Boolean)), m = ls.filter(l => people.has(l.to));
    if (m.length !== 1){ scanSay(`${e.name} ma kilka wypożyczeń. Od kogo wraca?`); const bag = $("#scan-bag"); if (bag) bag.innerHTML = `<div class="choice">${ls.map(l => `<button type="button" class="btn" data-act="ret-pick" data-id="${l.id}">${esc(l.to || "")}${unitTxt(l) ? ` · ${esc(unitTxt(l))}` : ""} · ${lq(l)} szt.</button>`).join("")}</div>`; return; }
    S.retBasket.push(m[0].id); scanSay(`✓ ${e.name} (${m[0].to}). Zeskanuj następną.`); updateScanUI(); return;
  }
  S.retBasket.push(ls[0].id); scanSay(`✓ ${e.name} (${ls[0].to}). Zeskanuj następną.`); updateScanUI();
}
async function tablePdf(o){
  if (!S.downloads){ toast("Pobieranie plików nie działa w tym widoku.", "err"); return; }
  toast("Przygotowuję PDF…");
  try {
    await Promise.all([loadScript(JSPDF_URL), fontsReady()]);
    const W = 210, H = 297, M = 14, k = 5.2, P = v => v * k;
    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    const cv = document.createElement("canvas"); cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    const ctx = cv.getContext("2d"); ctx.textBaseline = "top";
    const F = (w, sz, fam) => { ctx.font = `${w} ${P(sz)}px ${fam === "d" ? '"Archivo", "Arial Narrow", sans-serif' : '"IBM Plex Sans", system-ui, sans-serif'}`; };
    const ink = "#131C25", ink2 = "#465463", line = "#C9D1D9", band = "#EEF1F4";
    let page = 0, y = 0;
    const cols = o.cols, tw = W - 2 * M, sumW = cols.reduce((s, c) => s + c.w, 0), cw = cols.map(c => c.w / sumW * tw);
    const flush = () => { pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, W, H, undefined, "FAST"); };
    const footer = () => { F(400, 2.6); ctx.fillStyle = ink2; ctx.fillText(`${o.foot || "Wypożyczalnia Hufca"} · wygenerowano ${fmtDT(now())} · strona ${page}`, P(M), P(H - M + 4)); };
    const tableHead = () => { F(600, 2.8); ctx.fillStyle = band; ctx.fillRect(P(M), P(y), P(tw), P(7)); ctx.fillStyle = ink2; let x = M; cols.forEach((c, j) => { ctx.fillText(c.h, P(x + 1.6), P(y + 2.1)); x += cw[j]; }); y += 7; };
    const newPage = () => {
      if (page){ footer(); flush(); pdf.addPage("a4", "portrait"); }
      page++; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); y = M;
      if (page === 1){
        F(800, 7, "d"); ctx.fillStyle = ink; ctx.fillText(o.title, P(M), P(y)); y += 9.5;
        if (o.sub){ F(400, 3.3); ctx.fillStyle = ink2; ctx.fillText(o.sub, P(M), P(y)); y += 6; }
        if (o.meta && o.meta.length){
          y += 1; const colW = tw / 2; let mx = 0, rowY = y;
          o.meta.forEach(([kk, v], n) => { const x = M + (n % 2) * colW; F(600, 2.7); ctx.fillStyle = ink2; ctx.fillText(kk.toUpperCase(), P(x), P(rowY)); F(500, 3.4); ctx.fillStyle = ink; const ls = wrapText(ctx, v || "—", P(colW - 4), 2); ls.forEach((l, li) => ctx.fillText(l, P(x), P(rowY + 3.6 + li * 4.3))); mx = Math.max(mx, 3.6 + ls.length * 4.3); if (n % 2 === 1 || n === o.meta.length - 1){ rowY += mx + 2.5; mx = 0; } });
          y = rowY + 1;
        }
        if (o.note){ F(400, 3); ctx.fillStyle = ink2; wrapText(ctx, o.note, P(tw), 4).forEach(l => { ctx.fillText(l, P(M), P(y)); y += 4.2; }); y += 2; }
      } else { F(600, 3); ctx.fillStyle = ink2; ctx.fillText(`${o.title} (ciąg dalszy)`, P(M), P(y)); y += 7; }
      tableHead();
    };
    newPage();
    const bodyF = () => F(400, 3.3), lh = 4.3;
    for (const r of o.rows){
      if (r.group){
        if (y + 16 > H - M){ newPage(); }
        y += 2; F(700, 3.4); ctx.fillStyle = ink; ctx.fillText(r.group, P(M), P(y + 1)); y += 6; ctx.strokeStyle = ink; ctx.lineWidth = P(0.3); ctx.beginPath(); ctx.moveTo(P(M), P(y)); ctx.lineTo(P(M + tw), P(y)); ctx.stroke(); continue;
      }
      bodyF();
      const cells = cols.map((c, j) => c.box ? null : wrapText(ctx, String(r.cells[j] ?? ""), P(cw[j] - 3.2), 6));
      const n = Math.max(1, ...cells.map(c => c ? c.length : 1)), rh = n * lh + 3.4;
      if (y + rh > H - M - 2) newPage();
      let x = M;
      cols.forEach((c, j) => {
        if (c.box){ ctx.strokeStyle = ink2; ctx.lineWidth = P(0.3); ctx.strokeRect(P(x + 1.6), P(y + 1.6), P(3.6), P(3.6)); }
        else { bodyF(); if (c.bold){ F(600, 3.3); } ctx.fillStyle = c.muted ? ink2 : ink; cells[j].forEach((l, li) => ctx.fillText(l, P(x + 1.6), P(y + 1.7 + li * lh))); }
        x += cw[j];

    }
    if (o.sign){ y += 10; if (y + 12 > H - M) newPage(); F(400, 3); ctx.fillStyle = ink2; o.sign.forEach((s, n) => { const x = M + n * (tw / o.sign.length); ctx.strokeStyle = ink2; ctx.lineWidth = P(0.2); ctx.beginPath(); ctx.moveTo(P(x), P(y + 8)); ctx.lineTo(P(x + tw / o.sign.length - 8), P(y + 8)); ctx.stroke(); ctx.fillText(s, P(x), P(y + 9.5)); }); }
    footer(); flush();
    await S.downloads.save({filename:o.filename, data:pdf.output("blob")});
  } catch (e){ if (!e || e.code !== "declined"){ console.error(e); toast("Nie udało się przygotować PDF.", "err"); } }
}

  if (a && !e.defaultPrevented){
    const h = a.getAttribute("href");
    if (h === location.hash || (h === "#" && (location.hash === "" || location.hash === "#"))){ e.preventDefault(); closeSheet(); S.q = ""; $("#q").value = ""; if (a.dataset.act === "lent-filter") S.lentFilter = a.dataset.f; render(); window.scrollTo(0, 0); return; }
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case "close-sheet": closeSheet(); break;
    case "add-room": roomForm(null); break;
    case "add-box": boxForm(null, {roomId:b.dataset.room}); break;
    case "add-item": itemForm(null, {roomId:b.dataset.room, boxId:b.dataset.box || ""}); break;
    case "edit": { const [k, ent] = findCode(id); if (k === "room") roomForm(ent); else if (k === "box") boxForm(ent); else if (k === "item") itemForm(ent); break; }
    case "lend": openLend([{itemId:id, qty:1}]); break;
    case "return": openReturn([id]); break;
    case "return-many": openReturn(String(b.dataset.ids || "").split(",").filter(Boolean)); break;
    case "remind": remindSheet(String(b.dataset.ids || "").split(",").filter(Boolean)); break;
    case "cart-toggle": cartToggle(id); break;
    case "cart-clear": S.cart = []; cartDraftClear(); saveCart(); toast("Wyczyszczono koszyk."); break;
    case "cart-view": cartSheet(); break;
    case "log-show": logShow(id); break;
    case "log-plans": S.lentFilter = "plans"; go("wypozyczone"); break;
    case "cart-open": openLend(S.cart, {fromCart:true}); break;
    case "plan-new": openLend([{itemId:id, qty:1}], {mode:"plan"}); break;
    case "plan-issue": { const p = S.plans.find(x => x.id === id); if (p) openLend(p.items || [], {plan:p}); break; }
    case "plan-edit": { const p = S.plans.find(x => x.id === id); if (p) openLend(p.items || [], {editPlan:p}); break; }
    case "plan-del": planDel(id); break;
    case "plan-del-do": planDelDo(id, b); break;
    case "plan-mail": planMail(id); break;
    case "req-plan": case "req-issue": { const r = S.requests.find(x => x.id === id); if (r) openLend(Array.isArray(r.items) ? r.items.filter(x => S.items.has(x.itemId)).map(x => ({itemId:x.itemId, qty:Math.max(1, +x.qty || 1)})) : [], {request:r, mode:act === "req-issue" ? "now" : "plan"}); break; }
    case "req-reply": reqReply(id); break;
    case "req-reject": reqReject(id); break;
    case "req-del": reqDel(id); break;
    case "req-del-do": (async () => { b.disabled = true; const r0 = S.requests.find(x => x.id === id); try { await retry(() => S.db.doc("requests/" + id).delete()); if (r0) logEv("req", `Usunięto wniosek: ${[r0.name, r0.unit].filter(Boolean).join(", ")}`, {unit:r0.unit || "", d:r0.what || ""}); closeSheet(); toast("Usunięto wniosek."); } catch (err){ b.disabled = false; handleErr(err); } })(); break;
    case "req-help": reqHelp(); break;
    case "copy-units": copyText(unitsList().join("\n")); break;
    case "copy-mail": { const t = $("#m-body"); if (t) copyText(t.value, t); break; }
    case "role": setRole(); break;
    case "back": goBack(); break;
    case "inw-acct": if (window.INW_ACCT) window.INW_ACCT(); break;
    case "inw-seed": if (window.INW_SEED) window.INW_SEED(b); break;
    case "inw-signout": if (window.INW_SIGNOUT) window.INW_SIGNOUT(); break;
    case "inw-reset": if (window.INW_RESET) window.INW_RESET(); break;
    case "loan-show": loanShow(id); break;
    case "loan-edit": loanEdit(id); break;
    case "loan-extend": loanExtend(b.dataset.ids); break;
    case "loan-cancel": loanCancel(id); break;
    case "loan-cancel-do": loanCancelDo(id, b); break;
    case "loan-undo": loanUndo(id); break;
    case "loan-undo-do": loanUndoDo(id, b); break;
    case "group-more": groupMore(b.dataset.ids); break;
    case "plan-more": planMore(id); break;
    case "pdf-loans": pdfLoans(b.dataset.ids); break;
    case "pdf-plan": pdfPlan(id); break;
    case "prep-open": prepSheet(); break;
    case "prep-range": prepSheet(b.dataset.f); break;
    case "prep-pdf": prepPdf(); break;
    case "backup": backupXlsx(); break;
    case "unarchive": unarchive(id, b); break;
    case "purge": purgeAsk(id); break;
    case "purge-do": purgeDo(id, b); break;
    case "scan-aim": S.scanAim = b.dataset.f; scanSay(""); updateScanUI(); break;
    case "ret-pick": if (!S.retBasket.includes(id)) S.retBasket.push(id); scanSay("✓ Dodano do zwrotu. Zeskanuj następną."); updateScanUI(); break;
    case "ret-open": openReturn([...S.retBasket]); break;
    case "ret-clear": S.retBasket = []; scanSay(""); updateScanUI(); break;
    case "hist-type": S.hist.type = b.dataset.f; S.histLimit = 60; render(); break;
    case "theme": toggleTheme(); break;
    case "arrange": S.arrange = !S.arrange; render(); break;
    case "room-up": moveRoom(id, -1); break;
    case "room-down": moveRoom(id, 1); break;
    case "import-items": importForm(); break;
    case "imp-template": importTemplate(); break;
    case "units-edit": unitsForm(); break;
    case "cats-edit": catsForm(); break;
    case "cat-assign": catAssignSheet(b.dataset.f); break;
    case "label-toggle": { const i = S.items.get(id); if (i) (async () => { const v = i.label !== true; try { await retry(() => S.db.doc("items/" + id).update({label:v, updatedAt:now(), updatedBy:S.me.id})); logEv("label", `${v ? "Ma naklejkę" : "Brak naklejki"}: ${i.name}`, {item:id}); toast(v ? "Oznaczono: ma naklejkę." : "Oznaczono: brak naklejki. Wydrukujesz ją w Etykietach."); } catch (err){ handleErr(err); } })(); break; }
    case "photo": photoSheet(id); break;
    case "lab-nolabel": S.lab.noLabel = !S.lab.noLabel; render(); break;
    case "report": reportForm(id); break;
    case "issue-fix": resolveIssue(id, "fixed", b); break;
    case "issue-off": resolveIssue(id, "writeoff", b); break;
    case "qr": qrSheet(id); break;
    case "lost-label": lostLabelSheet(b.dataset.kind, id); break;
    case "assign-new": openScan({kind:b.dataset.kind, id}); break;
    case "assign-existing": pickExisting(b.dataset.code); break;
    case "alias-pick": assignCodeTo({kind:b.dataset.kind, id}, b.dataset.code, (m, err) => toast(m, err ? "err" : "")); break;
    case "alias-rm": askAliasRm(id, b.dataset.code); break;
    case "alias-rm-do": aliasRm(id, b.dataset.code); break;
    case "label": S.labSel.add(id); closeSheet(); toast("Dodano do etykiet."); go("etykiety"); break;
    case "copy-link": { const txt = qrText(id); const done = () => toast("Skopiowano link."); const fail = () => { const el = $("#qr-link"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Zaznaczyłem link. Skopiuj go ręcznie."); }; try { navigator.clipboard.writeText(txt).then(done, fail); } catch (_){ fail(); } break; }
    case "scan": openScan(null); break;
    case "scan-cam": $("#scan-cam").click(); break;
    case "scan-gal": $("#scan-gal").click(); break;
    case "lent-filter": S.lentFilter = b.dataset.f; if (b.tagName !== "A") render(); break;
    case "hist-more": S.histLimit += 100; render(); break;
    case "lab-type": S.lab.types[b.dataset.t] = !S.lab.types[b.dataset.t]; render(); break;
    case "lab-all": { const vis = visibleLabelEnts(), all = vis.every(x => S.labSel.has(x.id)); vis.forEach(x => all ? S.labSel.delete(x.id) : S.labSel.add(x.id)); render(); break; }
    case "lab-none": S.labSel.clear(); render(); break;
    case "lab-pdf": makePdf(); break;
    case "export-csv": exportCsv(); break;
    case "assign": { const k = b.dataset.kind, code = b.dataset.code; if (k === "room") roomForm(null, {code}); else if (k === "box") boxForm(null, {code}); else itemForm(null, {code}); break; }
    case "ask-delete": askDelete(id); break;
    case "do-delete": doDelete(id, b); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-lab]")){ t.checked ? S.labSel.add(t.dataset.lab) : S.labSel.delete(t.dataset.lab); labUpdate(); return; }
  if (t.id === "lab-fmt"){ S.lab.fmt = t.value; const f = FMT[t.value]; S.lab.skip = Math.min(S.lab.skip, f.cols * f.rows - 1); render(); return; }
  if (t.id === "lab-copies"){ S.lab.copies = clampInt(t.value, 1, 3); labUpdate(); return; }
  if (t.id === "lab-cut"){ S.lab.cut = t.checked; labUpdate(); return; }
  if (t.id === "lab-room"){ S.lab.room = t.value; render(); return; }
  if (t.id === "scan-cam" || t.id === "scan-gal"){ handleScanFile(t); return; }
  if (t.id === "hist-period"){ S.hist.period = t.value; S.histLimit = 60; render(); return; }
  if (t.id === "hist-unit"){ S.hist.unit = t.value; S.histLimit = 60; render(); return; }
  if (t.id === "req-file"){ const f = t.files && t.files[0]; t.value = ""; importRequests(f); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "lab-skip"){ const f = FMT[S.lab.fmt]; S.lab.skip = clampInt(t.value, 0, f.cols * f.rows - 1); labUpdate(); }
  if (t.id === "lab-blank"){ S.lab.blank = clampInt(t.value, 0, 200); labUpdate(); }
  if (t.id === "hist-q"){ S.hist.q = t.value; S.histLimit = 60; const el = $("#hist-list"); if (el){ el.innerHTML = histListHTML(); fillNames(); } }
});
document.addEventListener("error", e => { if (e.target && e.target.tagName === "IMG") e.target.classList.add("broken"); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#main").addEventListener("focusout", () => { setTimeout(() => { if (S.pendingRender && !$("#main").contains(document.activeElement)) render(); }, 0); });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
window.addEventListener("hashchange", () => { onNav(); closeSheet(); S.q = ""; $("#q").value = ""; render(); window.scrollTo(0, 0); });

/* ---------- boot ---------- */
function onSubErr(name){
  return e => {
    console.warn(name, e);
    if (e && e.code === "revoked"){ S.dbState = "none"; render(); return; }
    if (e && e.code === "unavailable"){ setTimeout(() => subOne(name), 3000); return; }
    toast("Nie udało się wczytać części danych. Odśwież stronę.", "err");
  };
}
function subOne(name){
  let q;
  if (name === "active") q = S.db.collection("loans").where("open", "==", true);
  else if (name === "loans") q = S.db.collection("loans").orderBy("out", "desc").limit(1000);
  else if (name === "issues") q = S.db.collection("issues").orderBy("at", "desc").limit(1000);
  else if (name === "log") q = S.db.collection("log").orderBy("day", "desc").limit(400);
  else q = S.db.collection(name);
  q.onSnapshot(snap => {
    if (name === "log") S.log = snap.docs.flatMap(d => { const v = d.data() || {}; return Object.entries(v.ev && typeof v.ev === "object" ? v.ev : {}).map(([id, e]) => ({...e, id})); }).filter(e => e && e.at).sort((a, b) => String(b.at).localeCompare(String(a.at)));
    else if (["active", "loans", "issues", "plans", "requests"].includes(name)) S[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
    else {
      const m = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
      if (name === "items"){ S.items = new Map([...m].filter(([, v]) => !v.archived)); S.archived = new Map([...m].filter(([, v]) => v.archived)); }
      else S[name] = m;
      if (name !== "config") rebuildAlias();
    }
    S.got[name] = true; scheduleRender();
  }, e => { S.got[name] = true; scheduleRender(); onSubErr(name)(e); });
}
async function boot(){
  $("#brand-mark").innerHTML = IC.scan;
  $("#back-btn .bk-ic").innerHTML = IC.back; applyTheme();
  $("#search-ic").outerHTML = IC.search;
  try { const v = JSON.parse(store.get("inwh-cart") || "[]"); if (Array.isArray(v)) S.cart = v.filter(x => x && typeof x.itemId === "string").map(x => ({itemId:x.itemId, qty:Math.max(1, +x.qty || 1)})); } catch (_){}
  S.role = store.get("inw-role") === "simple" ? "simple" : "full";
  buildTabs();
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function"){ S.dbState = "none"; render(); return; }
  const get = n => c.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([get("db"), get("user"), get("assets"), get("downloads")]);
  S.user = user; S.assets = assets; S.downloads = downloads;
  if (user){
    const me = await user.me(); S.me = {id:me.id, name:me.name || ""};
    const w = await user.can("data.write"); if (w === true || w === false){ S.canKnown = true; S.canWrite = w; }
  }
  if (!db){ S.dbState = "none"; render(); return; }
  S.db = db; S.dbState = "ok"; if (window.INW_ACCOUNT) S.role = window.INW_ACCOUNT.role === "admin" ? "full" : "simple"; updateRO(); buildTabs();
  (window.INW_SUBS ? window.INW_SUBS() : ["rooms", "boxes", "items", "active", "loans", "issues", "plans", ...(FEAT_REQ ? ["requests"] : []), "config", "log"]).forEach(subOne);
  render();
}
boot();
